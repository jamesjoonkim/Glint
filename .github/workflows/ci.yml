name: CI

on:
  pull_request:
  push:
    branches: [main, feature/v2-rebuild]

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 10
    env:
      GLINT_LLM: fake
      GLINT_OCR: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: macos-14
    timeout-minutes: 15
    needs: test
    env:
      GLINT_LLM: fake
      GLINT_OCR: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        if: hashFiles('tests/e2e/**/*.spec.ts') != ''
